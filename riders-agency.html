<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riders &amp; Agency per Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="firebase-config.js"></script>
    <script type="module" src="auth.js"></script>
  <style>
    body{padding:0;margin:0;}
    .page-shell{max-width:1280px;margin:0 auto;padding:28px;}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
    .page-head h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0;}
    .page-head p{margin:4px 0 0;color:var(--text-dim);font-size:13px;}
    .status-box{background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--text-dim);}
    .page-actions{display:flex;align-items:center;gap:10px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;text-decoration:none;transition:background .15s ease,border-color .15s ease;}
    .back-link:hover{background:var(--hover);}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .tab-btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;transition:transform .2s ease,background .15s ease,border-color .15s ease,color .15s ease;}
    .tab-btn:hover{transform:translateY(-2px);}
    .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    @media (max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr);}}
    .stat-card{background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:14px;transition:transform .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s ease,border-color .25s ease;}
    .stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px var(--shadow);border-color:var(--amber);}
    .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;}
    .stat-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;}
    .stat-value.teal{color:var(--teal);}
    .stat-value.brick{color:var(--brick);}
    .stat-value.amber{color:var(--amber-deep);}
    .search-row{margin-bottom:12px;}
.search-row input{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-family:'IBM Plex Sans';font-size:13px;background:var(--card);color:var(--text);}
    .table-card{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:16px;overflow:auto;position:relative;cursor:grab;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none;scrollbar-width:thin;}
    .table-card::-webkit-scrollbar{height:12px;width:12px;}
    .table-card::-webkit-scrollbar-track{background:var(--line-2);border-radius:999px;}
    .table-card::-webkit-scrollbar-thumb{background:var(--amber);border-radius:999px;border:3px solid var(--line-2);}
    body.dark .table-card::-webkit-scrollbar-track{background:var(--line);}
    body.dark .table-card::-webkit-scrollbar-thumb{border-color:var(--line);}
    .table-card.dragging{cursor:grabbing;}
    .table-card.dragging *{pointer-events:none;}
    .table-card .drag-fade{position:absolute;top:0;right:0;bottom:0;width:34px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--card));opacity:0;transition:opacity .2s ease;z-index:2;}
    body.dark .table-card .drag-fade{background:linear-gradient(90deg,transparent,var(--card));}
    .table-card .drag-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);pointer-events:none;background:var(--ink);color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em;padding:6px 14px;border-radius:999px;opacity:0;transition:opacity .25s ease;z-index:3;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;align-items:center;gap:6px;}
    .table-card .drag-hint svg{width:12px;height:12px;}
    /* Horizontal scroll control (visible on all breakpoints) */
    .h-scroll-control{display:flex;align-items:center;gap:10px;margin-top:12px;width:100%;}
    .h-scroll-btn{flex-shrink:0;width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s ease,border-color .15s ease,transform .12s ease,opacity .15s ease;touch-action:manipulation;}
    .h-scroll-btn:hover{background:var(--hover);border-color:var(--amber);}
    .h-scroll-btn:active{transform:scale(.9);}
    .h-scroll-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
    .h-scroll-btn svg{width:18px;height:18px;}
    .h-scroll-track{flex:1;height:8px;border-radius:999px;background:var(--line-2);position:relative;cursor:pointer;touch-action:pan-y;border:1px solid var(--line);}
    .h-scroll-thumb{position:absolute;top:1px;bottom:1px;left:0;width:40px;border-radius:999px;background:var(--amber);transition:background .15s ease;cursor:grab;}
    .h-scroll-thumb.dragging{cursor:grabbing;background:var(--amber-deep);}
    table{width:100%;border-collapse:collapse;font-size:14px;min-width:900px;}
    th, td{padding:12px 14px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap;}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);cursor:pointer;user-select:none;}
    th:hover{color:var(--text);}
    tbody tr{transition:background .12s ease;}
    tbody tr:hover{background:var(--hover);}
    .muted{color:var(--text-dim);}
    .error{color:var(--brick);}
    .status-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
    .status-active{background:rgba(52,211,153,.14);color:#22c55e;}
    .status-suspended{background:rgba(239,68,68,.12);color:#ef4444;}
    .animate-in{animation:fadeUp .5s cubic-bezier(.22,.61,.36,1) both;}
    .delay-1{animation-delay:.05s;}
    .delay-2{animation-delay:.1s;}
    .delay-3{animation-delay:.15s;}
    .delay-4{animation-delay:.2s;}
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="page-head">
      <div>
        <h1>Riders &amp; Agency per Hub</h1>
        <p>Data is loaded from your Google Sheet and split by hub.</p>
      </div>
      <div class="page-actions">
        <a class="back-link" href="index.html">← Back to Rider Performance System</a>
        <div class="status-box" id="sheetStatus">Loading sheet…</div>
      </div>
    </div>
    <div class="tabs" id="hubTabs">
      <button class="tab-btn active" data-hub="Buguias" type="button">Buguias</button>
      <button class="tab-btn" data-hub="MB Atok" type="button">MB Atok</button>
      <button class="tab-btn" data-hub="Bauko" type="button">Bauko</button>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search rider name, area, agency, account ID, contact…">
    </div>
<div class="table-card" id="tableCard">
      <div class="drag-fade" id="dragFade"></div>
      <table>
        <thead id="ridersHead"></thead>
        <tbody id="sheetRows"></tbody>
      </table>
      <div class="drag-hint" id="dragHint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        Swipe to see more
      </div>
    </div>
    <div class="h-scroll-control" id="hScrollControl">
      <button class="h-scroll-btn" id="hScrollPrev" type="button" aria-label="Scroll left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="h-scroll-track" id="hScrollTrack">
        <div class="h-scroll-thumb" id="hScrollThumb"></div>
      </div>
      <button class="h-scroll-btn" id="hScrollNext" type="button" aria-label="Scroll right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <script type="module">
    const __perms = await window.Auth.guard('riders');
    if (!__perms) throw new Error('redirect');
    const SHEET_ID = '1aGJXuO3tz5oLJyL6piEljz4A6cg6l0cnKvmtIpLkqMI';
    const HUB_SHEET_NAME = {
      Buguias: 'Buguias',
      Bauko: 'Bauko',
      'MB Atok': 'MB Atok'
    };
    const statusEl = document.getElementById('sheetStatus');
    const rowsEl = document.getElementById('sheetRows');
    const statsRowEl = document.getElementById('statsRow');
    const searchEl = document.getElementById('searchInput');
    const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));
    let sortableHeaders = [];
    let columns = [];

    function applyHubFilter(){
      const allowed = (__perms && __perms.hubs && __perms.hubs.length) ? __perms.hubs : ['Buguias','MB Atok','Bauko'];
      tabButtons.forEach(btn=>{
        const hub = btn.dataset.hub;
        const ok = allowed.includes(hub) || (hub==='All' && allowed.length>1);
        btn.style.display = ok ? '' : 'none';
      });
      if(!allowed.includes(currentHub)){
        currentHub = allowed[0] || currentHub;
        tabButtons.forEach(b=>b.classList.toggle('active', b.dataset.hub===currentHub));
      }
    }

    let allRows = [];
    let currentHub = 'Buguias';
    let hasHubColumn = false;
    let search = '';
    let sortKey = 'riderName';
    let sortDir = 'asc';

    function parseCsvLine(line) {
      const values = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) { values.push(current); current = ''; }
        else { current += ch; }
      }
      values.push(current);
      return values;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, match => ({'&':'&amp;','<':'<','>':'>','"':'"',"'":'&#39;'}[match]));
    }

    function findHeaderIndex(headers, candidates) {
      for (const candidate of candidates) {
        const index = headers.findIndex(h => h === candidate || h.includes(candidate));
        if (index >= 0) return index;
      }
      return -1;
    }

    function getCell(values, index) {
      return index >= 0 && values[index] !== undefined ? values[index].trim() : '';
    }

    async function loadSheet() {
      try {
        const sheetName = HUB_SHEET_NAME[currentHub] || HUB_SHEET_NAME.Buguias;
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
        const response = await fetch(SHEET_URL);
        if (!response.ok) throw new Error('Unable to fetch sheet');
        const text = await response.text();
        const rawLines = text.split(/\r\n|\n|\r/);
        if (rawLines.length < 2) throw new Error('No rows found in sheet');

        const parsedLines = rawLines.map(line => parseCsvLine(line));
        const headerRowIndex = parsedLines.findIndex(values => {
          const normalized = values.map(v => String(v || '').trim().toLowerCase());
          return normalized.some(h => ['rider name','rider','driver name','driver','name'].includes(h))
              && normalized.some(h => ['area','location'].includes(h));
        });
        if (headerRowIndex < 0) throw new Error('Header row not found in sheet');

        const headers = parsedLines[headerRowIndex];
        const expectedColumns = headers.length;
        const normalizedHeaders = headers.map(h => String(h || '').trim().toLowerCase());

        function isHeaderRow(values) {
          const normalized = values.map(v => String(v || '').trim().toLowerCase());
          return normalizedHeaders.every((header, idx) => normalized[idx] === header || normalized[idx] === '');
        }

        const dataRows = parsedLines.slice(headerRowIndex + 1)
          .filter(row => row.some(cell => String(cell || '').trim() !== ''))
          .filter(row => !isHeaderRow(row))
          .map(row => row.concat(Array(Math.max(0, expectedColumns - row.length)).fill('')));

        const index = {
          riderName: findHeaderIndex(normalizedHeaders, ['rider name','rider','driver name','driver','name']),
          area: findHeaderIndex(normalizedHeaders, ['area','location']),
          contact: findHeaderIndex(normalizedHeaders, ['contact #','contact','contact number','phone','mobile']),
          accountId: findHeaderIndex(normalizedHeaders, ['account id','accountid','account','acct id']),
          agency: findHeaderIndex(normalizedHeaders, ['agency','agencies']),
          status: findHeaderIndex(normalizedHeaders, ['status','state']),
          hub: findHeaderIndex(normalizedHeaders, ['hub','hubs','branch','branch name'])
        };
        hasHubColumn = index.hub >= 0;

        columns = normalizedHeaders.map((h, i) => ({
          idx: i,
          key: h,
          label: ({'rider name':'Rider Name','rider':'Rider Name','driver name':'Rider Name','driver':'Rider Name','name':'Rider Name','area':'Area','location':'Area','contact #':'Contact #','contact':'Contact #','contact number':'Contact #','phone':'Contact #','mobile':'Contact #','account id':'Account ID','accountid':'Account ID','account':'Account ID','acct id':'Account ID','agency':'Agency','agencies':'Agency','status':'Status','state':'Status','hub':'Hub','hubs':'Hub','branch':'Hub','branch name':'Hub'}[h] || headers[i]),
          isStatus: h === 'status' || h === 'state'
        }));

        allRows = dataRows.map(values => ({
          riderName: getCell(values, index.riderName),
          area: getCell(values, index.area),
          contact: getCell(values, index.contact),
          accountId: getCell(values, index.accountId),
          agency: getCell(values, index.agency),
          status: getCell(values, index.status),
          hub: hasHubColumn ? getCell(values, index.hub) : '',
          _cells: values
        })).filter(row => row.riderName || row.area || row.accountId || row.agency || row.status || row.hub);

        renderHead();
        renderStats();
        renderRows();
        statusEl.textContent = `Loaded ${allRows.length} rider records`;
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = '<span class="error">Could not load the Google Sheet. Check the published link and try again.</span>';
        rowsEl.innerHTML = `<tr><td colspan="${columns.length || 6}" class="error">No data available.</td></tr>`;
        statsRowEl.innerHTML = '';
      }
    }

    function getFilteredRows() {
      if (!hasHubColumn) return allRows;
      const target = currentHub.toLowerCase();
      return allRows.filter(row => {
        const hubValue = String(row.hub || '').toLowerCase();
        return hubValue.includes(target) || hubValue === target;
      });
    }

    function cellVal(row, key){
      if (row[key] !== undefined && row[key] !== null && row[key] !== '') return row[key];
      const col = columns.find(c => c.key === key);
      if (col && row._cells && row._cells[col.idx] !== undefined) return row._cells[col.idx];
      return '';
    }

    function applySorting(rows) {
      const dir = sortDir === 'asc' ? 1 : -1;
      return rows.slice().sort((a, b) => {
        let av = String(cellVal(a, sortKey) || '').toLowerCase();
        let bv = String(cellVal(b, sortKey) || '').toLowerCase();
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return 0;
      });
    }

    function renderStats() {
      const rows = getFilteredRows();
      const active = rows.filter(r => String(r.status || '').trim().toLowerCase() === 'active').length;
      const suspended = rows.filter(r => String(r.status || '').trim().toLowerCase() === 'suspended').length;
      const agencies = new Set(rows.map(r => String(r.agency || '').trim()).filter(Boolean)).size;
      const stats = [
        { label: 'Riders', value: rows.length, cls: '' },
        { label: 'Active', value: active, cls: 'teal' },
        { label: 'Suspended', value: suspended, cls: 'brick' },
        { label: 'Agencies', value: agencies, cls: 'amber' },
      ];
      statsRowEl.innerHTML = stats.map((s, idx) => `
        <div class="stat-card">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value ${s.cls}">${s.value}</div>
        </div>
      `).join('');
    }

    function getStatusClass(status) {
      const normalized = String(status || '').trim().toLowerCase();
      if (normalized === 'active') return 'status-active';
      if (normalized === 'suspended') return 'status-suspended';
      return '';
    }

    function renderHead() {
      const head = document.getElementById('ridersHead');
      if (!head) return;
      head.innerHTML = '<tr>' + columns.map(c => `<th data-sort="${escapeHtml(c.key)}">${escapeHtml(c.label)}</th>`).join('') + '</tr>';
      sortableHeaders = Array.from(head.querySelectorAll('th[data-sort]'));
      sortableHeaders.forEach(th => {
        th.addEventListener('click', () => {
          const key = th.dataset.sort;
          if (sortKey === key) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
          else { sortKey = key; sortDir = 'asc'; }
          renderRows();
        });
      });
    }

    function renderRows() {
      let rows = getFilteredRows();
      if (search) {
        const q = search.toLowerCase();
        rows = rows.filter(r => columns.some(c => String(cellVal(r, c.key) || '').toLowerCase().includes(q)));
      }
      rows = applySorting(rows);
      if (!rows.length) {
        rowsEl.innerHTML = `<tr><td colspan="${columns.length || 6}" class="muted">No rider records found for this hub.</td></tr>`;
        return;
      }
      rowsEl.innerHTML = rows.map(r => '<tr>' + columns.map(c => {
        if (c.isStatus) {
          const v = escapeHtml(r.status || '');
          const cls = getStatusClass(r.status);
          return `<td><span class="status-chip ${cls}">${v}</span></td>`;
        }
        return `<td>${escapeHtml(String(cellVal(r, c.key) || ''))}</td>`;
      }).join('') + '</tr>').join('');
    }

    if (typeof window.applySavedTheme === 'function') window.applySavedTheme();

    searchEl.addEventListener('input', e => { search = e.target.value; renderRows(); });

    tabButtons.forEach(btn => {
      btn.addEventListener('click', async () => {
        if (btn.dataset.hub === currentHub) return;
        currentHub = btn.dataset.hub;
        tabButtons.forEach(b => b.classList.toggle('active', b === btn));
        statusEl.textContent = 'Loading sheet…';
        rowsEl.innerHTML = `<tr><td colspan="${columns.length || 6}" class="muted">Loading...</td></tr>`;
        await loadSheet();
      });
    });

/* ---- Sideways drag-to-scroll control for the riders table ---- */
    const tableCardEl = document.getElementById('tableCard');
    const dragFadeEl = document.getElementById('dragFade');
    const dragHintEl = document.getElementById('dragHint');
    let dragState2 = null;

    function tableOverflows() {
      return tableCardEl.scrollWidth > tableCardEl.clientWidth + 1;
    }

    function updateHintVisibility() {
      if (!dragHintEl || !dragFadeEl) return;
      const overflows = tableOverflows();
      const atEnd = tableCardEl.scrollLeft + tableCardEl.clientWidth >= tableCardEl.scrollWidth - 4;
      dragHintEl.style.opacity = (overflows && !atEnd) ? '1' : '0';
      dragFadeEl.style.opacity = (overflows && !atEnd) ? '1' : '0';
    }

    function onTableDragStart(e) {
      // Only start dragging on horizontal intent; ignore clicks on sortable headers
      if (e.target.closest('th[data-sort]')) return;
      const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
      dragState2 = {
        startX: pt.clientX,
        startY: pt.clientY,
        startLeft: tableCardEl.scrollLeft,
        moved: false
      };
      tableCardEl.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.webkitUserSelect = 'none';
    }

    function onTableDragMove(e) {
      if (!dragState2) return;
      const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
      const dx = pt.clientX - dragState2.startX;
      const dy = pt.clientY - dragState2.startY;
      // Only treat as a sideways drag once horizontal movement dominates
if(!dragState2.moved && Math.abs(dx) > 4 && Math.abs(dx) > Math.abs(dy)) {
        dragState2.moved = true;
      }
      if (!dragState2.moved) return;
      if (e.cancelable) e.preventDefault();
      tableCardEl.scrollLeft = dragState2.startLeft - dx;
      updateHintVisibility();
    }

    function onTableDragEnd() {
      if (!dragState2) return;
      dragState2 = null;
      tableCardEl.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.webkitUserSelect = '';
      updateHintVisibility();
    }

    if (tableCardEl) {
      tableCardEl.addEventListener('mousedown', onTableDragStart);
      window.addEventListener('mousemove', onTableDragMove);
      window.addEventListener('mouseup', onTableDragEnd);
      tableCardEl.addEventListener('touchstart', onTableDragStart, { passive: true });
      window.addEventListener('touchmove', onTableDragMove, { passive: false });
      window.addEventListener('touchend', onTableDragEnd);
      window.addEventListener('touchcancel', onTableDragEnd);
      tableCardEl.addEventListener('scroll', updateHintVisibility);
      window.addEventListener('resize', updateHintVisibility);
    }

// Re-evaluate the hint and scroll control after the sheet data renders
    const originalRenderRows = renderRows;
    renderRows = function () {
      originalRenderRows.apply(this, arguments);
      setTimeout(function () { updateHintVisibility(); updateScrollControl(); }, 0);
    };

    /* ---- Horizontal scroll control (arrows + draggable thumb) ---- */
    const hScrollControl = document.getElementById('hScrollControl');
    const hScrollPrev = document.getElementById('hScrollPrev');
    const hScrollNext = document.getElementById('hScrollNext');
    const hScrollTrack = document.getElementById('hScrollTrack');
    const hScrollThumb = document.getElementById('hScrollThumb');
    let thumbDragState = null;

    function updateScrollControl() {
      if (!hScrollControl || !tableCardEl) return;
      const overflows = tableOverflows();
      hScrollControl.style.display = overflows ? 'flex' : 'none';
      if (!overflows) return;

      const maxLeft = tableCardEl.scrollWidth - tableCardEl.clientWidth;
      const trackWidth = hScrollTrack.clientWidth;
      const minThumb = 40;
      const thumbWidth = Math.max(minThumb, Math.min(trackWidth, (tableCardEl.clientWidth / tableCardEl.scrollWidth) * trackWidth));
      hScrollThumb.style.width = thumbWidth + 'px';

      const maxThumbLeft = trackWidth - thumbWidth;
      const ratio = maxLeft > 0 ? tableCardEl.scrollLeft / maxLeft : 0;
      hScrollThumb.style.left = (ratio * maxThumbLeft) + 'px';

      hScrollPrev.disabled = tableCardEl.scrollLeft <= 0;
      hScrollNext.disabled = tableCardEl.scrollLeft >= maxLeft - 1;
    }

function scrollTableBy(delta) {
      if (!tableCardEl) return;
      tableCardEl.scrollBy({ left: delta, behavior: 'smooth' });
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    if (hScrollPrev && hScrollNext && hScrollTrack && hScrollThumb) {
      hScrollPrev.addEventListener('click', function () { scrollTableBy(-320); });
      hScrollNext.addEventListener('click', function () { scrollTableBy(320); });

      // Click on track to jump
      hScrollTrack.addEventListener('click', function (e) {
        if (e.target === hScrollThumb) return;
        const rect = hScrollTrack.getBoundingClientRect();
        const ratio = clamp((e.clientX - rect.left) / rect.width, 0, 1);
        tableCardEl.scrollLeft = ratio * (tableCardEl.scrollWidth - tableCardEl.clientWidth);
        updateScrollControl();
      });

      // Drag the thumb
      function onThumbStart(e) {
        const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
        thumbDragState = { startX: pt.clientX, startLeft: tableCardEl.scrollLeft };
        hScrollThumb.classList.add('dragging');
        document.body.style.userSelect = 'none';
        document.body.style.webkitUserSelect = 'none';
        if (e.cancelable) e.preventDefault();
      }
      function onThumbMove(e) {
        if (!thumbDragState) return;
        const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
        const dx = pt.clientX - thumbDragState.startX;
        const trackWidth = hScrollTrack.clientWidth;
        const thumbWidth = hScrollThumb.offsetWidth;
        const maxThumbLeft = trackWidth - thumbWidth;
        const maxLeft = tableCardEl.scrollWidth - tableCardEl.clientWidth;
        const ratio = maxThumbLeft > 0 ? dx / maxThumbLeft : 0;
        tableCardEl.scrollLeft = thumbDragState.startLeft + ratio * maxLeft;
        updateScrollControl();
        if (e.cancelable) e.preventDefault();
      }
      function onThumbEnd() {
        if (!thumbDragState) return;
        thumbDragState = null;
        hScrollThumb.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.webkitUserSelect = '';
      }

      hScrollThumb.addEventListener('mousedown', onThumbStart);
      window.addEventListener('mousemove', onThumbMove);
      window.addEventListener('mouseup', onThumbEnd);
      hScrollThumb.addEventListener('touchstart', onThumbStart, { passive: false });
      window.addEventListener('touchmove', onThumbMove, { passive: false });
      window.addEventListener('touchend', onThumbEnd);
      window.addEventListener('touchcancel', onThumbEnd);

      // Keep control in sync while the table scrolls
      tableCardEl.addEventListener('scroll', updateScrollControl);
      window.addEventListener('resize', updateScrollControl);
    }

    applyHubFilter();
    loadSheet();

    setInterval(async function(){
      if(document.hidden) return;
      await loadSheet();
    }, 30000);
  </script>

  <!-- Shared Option Button / Options drawer (appears on all pages) -->
  <script src="options-drawer.js" defer></script>
</body>
