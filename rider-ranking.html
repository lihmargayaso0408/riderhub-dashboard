<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rider Ranking</title>
  
<link rel="preconnect" href="https://docs.google.com">

<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="cloudflare-config.js"></script>
<script src="sw-register.js" defer></script>
    <script type="module" src="cloudflare-api.js"></script>
    <script type="module" src="auth.js"></script>
    <style>
    body{padding:0;margin:0;}
    .page-shell{max-width:1440px;margin:0 auto;padding:28px;}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
    .page-head h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0;position:relative;padding-bottom:10px;}
    .page-head h1::after{content:'';position:absolute;left:0;bottom:0;width:56px;height:3px;border-radius:999px;background:var(--grad-brand);}
    .page-head p{margin:4px 0 0;color:var(--text-dim);font-size:13px;}
    .status-box{background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--text-dim);}
    .page-actions{display:flex;align-items:center;gap:10px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;text-decoration:none;transition:background .15s ease,border-color .15s ease;}
    .back-link:hover{background:var(--hover);}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .tab-btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;transition:transform .2s ease,background .15s ease,border-color .15s ease,color .15s ease;}
    .tab-btn:hover{transform:translateY(-2px);}
    .tab-btn.active{background:var(--grad-brand);color:var(--on-brand);border-color:transparent;box-shadow:0 4px 14px var(--glow);}
    .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
    @media (max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr);}}
    .stat-card{background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:14px;transition:transform .25s cubic-bezier(.22,.61,.36,1),box-shadow .25s ease,border-color .25s ease;}
    .stat-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px var(--shadow);border-color:var(--amber);}
    .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-bottom:8px;}
    .stat-value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;}
    .stat-value.teal{color:var(--teal);}
    .stat-value.brick{color:var(--brick);}
    .stat-value.amber{color:var(--amber-deep);}
    .search-row{margin-bottom:12px;}
    .search-row input{width:100%;max-width:340px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-family:'IBM Plex Sans';font-size:13px;background:var(--card);color:var(--text);}
    .table-card{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:16px;overflow:auto;}
    table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1000px;}
    th, td{padding:9px 11px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap;}
    th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);cursor:pointer;user-select:none;}
    th:hover{color:var(--text);}
    tbody tr{transition:background .12s ease;}
    tbody tr:hover{background:var(--hover);}
    .muted{color:var(--text-dim);}
    .error{color:var(--brick);}
    .num{font-family:'IBM Plex Mono',monospace;text-align:right;}
    .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;}
    .rank-1{background:var(--grad-brand);color:var(--on-brand);box-shadow:0 0 14px var(--glow);}
    .rank-2{background:var(--sun);color:#1A1A1E;}
    .rank-3{background:var(--amber-deep);color:#1A1A1E;}
    .rank-other{background:var(--hover);color:var(--text);}
    .perf-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
    .perf-top{background:rgba(0,201,120,.16);color:var(--teal);}
    .perf-bottom{background:rgba(255,107,107,.14);color:var(--brick);}
    .animate-in{animation:fadeUp .5s cubic-bezier(.22,.61,.36,1) both;}
    .delay-1{animation-delay:.05s;}
    .delay-2{animation-delay:.1s;}
    .delay-3{animation-delay:.15s;}
    .delay-4{animation-delay:.2s;}
/* Vehicle type segment control */
.vehicle-seg{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px 0;}
.seg-btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-family:'IBM Plex Mono',monospace;transition:background .15s ease,color .15s ease,border-color .15s ease,transform .15s ease;}
.seg-btn:hover{border-color:var(--amber);transform:translateY(-1px);}
.seg-btn.active{background:var(--grad-brand);color:var(--on-brand);border-color:transparent;box-shadow:0 4px 14px var(--glow);}
/* Multi-hub dropdown checkboxes */
.hub-check{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--line);border-radius:4px;margin-right:8px;flex-shrink:0;font-size:11px;}
.hub-dropdown-option.active .hub-check{border-color:var(--brand);background:var(--brand);color:#fff;}
.hub-dropdown-option .hub-check svg{width:10px;height:10px;}
/* Filter chips */
.filter-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px 0;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--hover);color:var(--text);padding:4px 10px;border-radius:999px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;}
.chip:hover{border-color:var(--amber);background:var(--card);}
.chip span{color:var(--text-dim);font-weight:700;line-height:1;}
/* Top / bottom 10 boxes */
.top10-wrap{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:0 0 16px 0;}
@media (max-width:700px){.top10-wrap{grid-template-columns:1fr;}}
.top10-panel{background:var(--card);border:1px solid var(--line-2);border-radius:8px;padding:14px;overflow:auto;}
.top10-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.top10-head h3{margin:0;font-family:'Space Grotesk',sans-serif;font-size:15px;}
.top10-head .tag{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dim);font-weight:600;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--hover);}
.top10-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.top10-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--hover);}
.top10-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;flex-shrink:0;}
.top10-rank.high{background:var(--grad-brand);color:var(--on-brand);box-shadow:0 0 12px var(--glow);}
.top10-rank.low{background:var(--brick);color:#fff;}
.top10-info{flex:1;min-width:0;}
.top10-info .top10-info-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top10-info .top10-info-meta{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top10-info .top10-info-meta span{color:var(--text-dim);}
.top10-val{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;white-space:nowrap;text-align:right;}
.top10-empty{text-align:center;padding:30px;color:var(--text-dim);font-size:13px;}
/* Smooth delivery-success color transition: red (low) → green (high) */
.rate-num{font-family:'IBM Plex Mono',monospace;font-weight:700;transition:color .25s ease;}
  </style>
</head>
<body class="dark">
  <div class="page-shell">
    <div class="page-head">
      <div>
        <h1>Rider Ranking</h1>
        <p>Top and least performers per hub based on Delivery Success Rate</p>
      </div>
      <div class="page-actions">
        <a class="back-link" href="index.html">← Back to Rider Performance System</a>
        <div class="status-box" id="rankingStatus">Loading data…</div>
      </div>
    </div>
    <div class="hub-dropdown" id="rankingHubDropdown">
      <button type="button" class="hub-dropdown-trigger" id="rankingHubTrigger" aria-haspopup="listbox" aria-expanded="false">
        <span class="hub-dropdown-value" id="rankingHubValue">All Hubs</span>
        <svg class="hub-dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="hub-dropdown-menu" id="rankingHubMenu" role="listbox"></div>
    </div>
    <div class="vehicle-seg" id="rankingVehicleSeg"></div>
    <div class="filter-chips" id="rankingFilterChips"></div>
    <div class="stats-row" id="statsRow"></div>
    <div class="top10-wrap" id="rankingTop10Wrap"></div>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Search rider name or ID...">
    </div>
    <div class="table-card" id="tableCard">
      <table>
        <thead>
          <tr>
            <th style="width:5%;" data-sort="rank">Rank</th>
            <th style="width:20%;" data-sort="rider name">Rider Name</th>
            <th style="width:10%;" data-sort="driver id">Driver ID</th>
            <th style="width:12%;" data-sort="hub">Hub</th>
            <th style="width:12%;" data-sort="vehicle">Vehicle</th>
            <th style="width:10%;" data-sort="days working">Days Working</th>
            <th style="width:12%;" data-sort="parcels/day">Parcels/Day</th>
            <th style="width:12%;" data-sort="delivery success">Delivery Success</th>
            <th style="width:10%;" data-sort="attendance">Attendance</th>
            <th style="width:12%;" data-sort="parcels delivered">Parcels Delivered</th>
          </tr>
        </thead>
        <tbody id="rankingRows"></tbody>
      </table>
    </div>
  </div>

<script type="module">
    if (!window.Auth) {
      // auth.js failed to load — fail visibly instead of hanging on a spinner.
      const el = document.getElementById('rankingStatus');
      if (el) el.textContent = 'Could not start — the authentication module failed to load. Please refresh the page.';
      throw new Error('auth unavailable');
    }
    const __perms = await window.Auth.guard('ranking');
    if (!__perms) throw new Error('redirect');
    const HUB_FALLBACK = ['Abra-Bucay','Bacarra','Badoc','Bangued','Bangui','Bantay','Bauko','Buguias','Candon','Dolores-Abra','Ilocos Sur','Ilocos Sur-Santa Lucia','Ilocos Sur-Santa Maria','Irisan','Itogon','Itogon Tuding','Kapangan','La Paz Abra','La Trinidad Pico','Laoag','MB Atok','Narvacan','North Laoag','San Nicolas','Santo Domingo','Tagudin'];
    const REMOVED_HUBS = ['MB Mankayan'];

    function isHubActive(hub) {
      return !REMOVED_HUBS.some(removed => removed.toLowerCase() === String(hub || '').trim().toLowerCase());
    }
    function sortHubs(hubs) {
      return hubs.filter(isHubActive).slice().sort((a,b) => a.localeCompare(b, 'en', { sensitivity: 'base' }));
    }

    const statusEl = document.getElementById('rankingStatus');
    const rowsEl = document.getElementById('rankingRows');
    const statsRowEl = document.getElementById('statsRow');
    const tableCardEl = document.getElementById('tableCard');
    const searchEl = document.getElementById('searchInput');
    const top10WrapEl = document.getElementById('rankingTop10Wrap');
    let allRows = [];
    let currentHubs = new Set(['All']);
    let currentVehicleGroups = new Set(['all']);
    let search = '';
    let sortKey = 'deliverySuccessRate';
    let sortDir = 'desc';

    const VEHICLE_GROUPS = [
      { key: 'all', label: 'All Vehicles' },
      { key: '4w', label: '4WAUV &amp; 4WSML', types: ['4wauv','4wsml'] },
      { key: '3w', label: '3WC &amp; 3WL', types: ['3wc','3wl'] },
      { key: '2w', label: '2WH', types: ['2wh'] },
      { key: 'flexi', label: 'Flexi', types: ['flexi'] },
    ];

    function vehicleGroupKey(vehicleType) {
      const v = String(vehicleType || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
      for (const g of VEHICLE_GROUPS) {
        if (g.types && g.types.includes(v)) return g.key;
      }
      return 'other';
    }

    function vehicleGroupLabel(key) {
      const g = VEHICLE_GROUPS.find(g => g.key === key);
      return g ? g.label : key;
    }

    function applyHubFilter(hubs){
      const allowed = (__perms && __perms.hubs && __perms.hubs.length) ? __perms.hubs : (hubs || HUB_FALLBACK);
      buildHubDropdown(allowed);
      currentHubs = new Set(['All']);
      currentVehicleGroups = new Set(['all']);
      const ve=document.getElementById('rankingHubValue');
      if(ve) ve.textContent = 'All Hubs';
      renderFilterChips();
    }

    function buildHubDropdown(hubs){
      const menu = document.getElementById('rankingHubMenu');
      if(!menu) return;
      menu.innerHTML = '';
      const search = document.createElement('input');
      search.type='text'; search.placeholder='Search hubs…';
      search.className='hub-dropdown-search';
      search.setAttribute('aria-label','Filter hubs');
      menu.appendChild(search);
      const wrap = document.createElement('div');
      wrap.className='hub-dropdown-options'; wrap.setAttribute('role','listbox');
      function addOption(label, value, checked){
        const opt=document.createElement('button');
        opt.type='button'; opt.className='hub-dropdown-option';
        opt.dataset.value=value; opt.setAttribute('role','option');
        if(checked) opt.classList.add('active');
        const box=document.createElement('span'); box.className='hub-check';
        box.innerHTML = checked ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>' : '';
        opt.appendChild(box);
        const span=document.createElement('span'); span.textContent=label;
        opt.appendChild(span);
        wrap.appendChild(opt);
      }
      const isAll = currentHubs.has('All') || currentHubs.size === 0;
      addOption('All Hubs','All', isAll);
      (hubs||[]).forEach(h=>{ addOption(h,h, currentHubs.has(h)); });
      menu.appendChild(wrap);
      const ve=document.getElementById('rankingHubValue');
      function updateTrigger(){
        if(!ve) return;
        if(currentHubs.has('All') || currentHubs.size===0){ ve.textContent='All Hubs'; return; }
        const names = [...currentHubs].filter(h=>h!=='All');
        ve.textContent = names.length > 3 ? names.length + ' hubs' : names.join(', ');
      }
      updateTrigger();
      function render(filter){
        const f=(filter||'').toLowerCase();
        wrap.querySelectorAll('.hub-dropdown-option').forEach(opt=>{
          opt.style.display = opt.textContent.toLowerCase().includes(f)?'':'none';
        });
      }
      render('');
      search.addEventListener('input', e=>render(e.target.value));
      search.addEventListener('click', e=>e.stopPropagation());
      wrap.addEventListener('click', e=>{
        const opt=e.target.closest('.hub-dropdown-option');
        if(!opt) return;
        e.stopPropagation();
        e.preventDefault();
        const menuEl = document.getElementById('rankingHubMenu');
        const dropdownScroll = wrap ? wrap.scrollTop : 0;
        const tableScroll = tableCardEl ? tableCardEl.scrollTop : 0;
        const val=opt.dataset.value;
        if(val === 'All'){
          currentHubs = new Set(['All']);
        } else {
          currentHubs.delete('All');
          if(currentHubs.has(val)) currentHubs.delete(val);
          else currentHubs.add(val);
          if(currentHubs.size === 0) currentHubs.add('All');
        }
        buildHubDropdown(hubs);
        updateTrigger();
          renderFilterChips();
          renderStats(); renderRows();
          renderTop10();
        const newWrap = menuEl ? menuEl.querySelector('.hub-dropdown-options') : null;
        if(newWrap) newWrap.scrollTop = dropdownScroll;
        if (tableCardEl) {
          tableCardEl.scrollTop = tableScroll;
          requestAnimationFrame(() => { tableCardEl.scrollTop = tableScroll; });
        }
      });
    }

    function openRankingHubDropdown(){
      const m=document.getElementById('rankingHubMenu'); const t=document.getElementById('rankingHubTrigger');
      if(m)m.classList.add('open'); if(t)t.setAttribute('aria-expanded','true');
    }
    function closeRankingHubDropdown(){
      const m=document.getElementById('rankingHubMenu'); const t=document.getElementById('rankingHubTrigger');
      if(m)m.classList.remove('open'); if(t)t.setAttribute('aria-expanded','false');
    }

    function normalizeHubName(value) {
      return String(value || '').trim().toLowerCase().replace(/\s+hub\s*$/i, '').replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function renderVehicleSeg(){
      const container = document.getElementById('rankingVehicleSeg');
      if(!container) return;
      container.innerHTML = VEHICLE_GROUPS.map(g=>{
        const active = currentVehicleGroups.has(g.key);
        return `<button type="button" class="seg-btn ${active?'active':''}" data-group="${g.key}">${g.label}</button>`;
      }).join('');
      container.querySelectorAll('.seg-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const key = btn.dataset.group;
          if(key === 'all'){
            currentVehicleGroups = new Set(['all']);
          } else {
            currentVehicleGroups.delete('all');
            if(currentVehicleGroups.has(key)) currentVehicleGroups.delete(key);
            else currentVehicleGroups.add(key);
            if(currentVehicleGroups.size === 0) currentVehicleGroups.add('all');
          }
          renderVehicleSeg();
          renderFilterChips();
          renderStats(); renderRows();
          renderTop10();
        });
      });
    }

    function renderFilterChips(){
      const el = document.getElementById('rankingFilterChips');
      if(!el) return;
      const chips = [];
      if(!(currentHubs.has('All') || currentHubs.size === 0)){
        [...currentHubs].filter(h=>h!=='All').forEach(h=>{
          chips.push(`<button type="button" class="chip" data-act="hub" data-val="${escapeHtml(h)}">${escapeHtml(h)} <span>×</span></button>`);
        });
      }
      if(currentVehicleGroups.size === 0 || currentVehicleGroups.has('all')){
        // all vehicles selected
      } else {
        [...currentVehicleGroups].filter(g=>g!=='all').forEach(g=>{
          chips.push(`<button type="button" class="chip" data-act="group" data-val="${escapeHtml(g)}">${escapeHtml(vehicleGroupLabel(g))} <span>×</span></button>`);
        });
      }
      el.innerHTML = chips.join('');
      el.querySelectorAll('.chip').forEach(btn=>{
        btn.addEventListener('click',()=>{
          const act = btn.dataset.act, val = btn.dataset.val;
          if(act === 'group'){
            currentVehicleGroups.delete(val);
            if(currentVehicleGroups.size === 0) currentVehicleGroups.add('all');
          } else { currentHubs.delete(val); if(currentHubs.size === 0) currentHubs.add('All'); }
          buildHubDropdown((__perms && __perms.hubs && __perms.hubs.length) ? __perms.hubs : HUB_FALLBACK);
          renderVehicleSeg();
          document.getElementById('rankingHubValue').textContent = (currentHubs.has('All') || currentHubs.size===0) ? 'All Hubs' : ([...currentHubs].filter(h=>h!=='All').length > 3 ? [...currentHubs].filter(h=>h!=='All').length + ' hubs' : [...currentHubs].filter(h=>h!=='All').join(', '));
          renderFilterChips();
          renderStats(); renderRows();
          renderTop10();
        });
      });
    }

    function renderTop10(){
      if(!top10WrapEl) return;
      const rows = applySorting(getFilteredRows());
      const high = rows.slice(0, 10);
      const low = rows.slice().reverse().slice(0, 10);
      const build = (list, kind) => {
        if(!list.length) return `<div class="top10-empty">No riders</div>`;
        return `<ul class="top10-list">${list.map((r, i)=>`
          <li class="top10-item">
            <span class="top10-rank" style="background:${successColor(r.deliverySuccessRate||0)};color:#fff;box-shadow:0 0 10px ${successColor(r.deliverySuccessRate||0)}">${i+1}</span>
            <div class="top10-info">
              <div class="top10-info-name">${escapeHtml(r.name)}</div>
              <div class="top10-info-meta"><span>${escapeHtml(r.id||'')}</span> · <span>${escapeHtml(r.hub||'N/A')}</span> · <span>${escapeHtml(r.vehicleType||'N/A')}</span></div>
            </div>
            <div class="top10-val" style="color:${successColor(r.deliverySuccessRate||0)}">${fmtPct(r.deliverySuccessRate||0)}</div>
          </li>
        `).join('')}</ul>`;
      };
      top10WrapEl.innerHTML = `
        <div class="top10-panel">
          <div class="top10-head">
            <h3>Top 10 Highest</h3>
            <span class="tag">Delivery Success</span>
          </div>
          ${build(high, 'high')}
        </div>
        <div class="top10-panel">
          <div class="top10-head">
            <h3>Top 10 Lowest</h3>
            <span class="tag">Delivery Success</span>
          </div>
          ${build(low, 'low')}
        </div>
      `;
    }

    async function loadData() {
      try {
        // Check if cloudflareAPI is available
        if (!window.cloudflareAPI || !window.cloudflareAPI.isEnabled()) {
          statusEl.innerHTML = '<span class="error">Cloudflare Worker not configured — cannot load ranking data.</span>';
          return;
        }

        // Load hub list from Cloudflare Worker
        const hubs = await window.Auth.getHubs();
        console.log('Available hubs:', hubs);
        const allData = [];

        // The hub index is a single document — read it once instead of once per
        // hub, then pull every hub's latest snapshot in parallel.
        let index = null;
        try {
          const indexResult = await window.cloudflareAPI.get('hubs-index');
          if (indexResult && indexResult.value) index = JSON.parse(indexResult.value);
        } catch (e) {
          console.warn('Failed to load hubs index:', e);
        }

        if (index) {
          const perHub = await Promise.all(hubs.map(async hub => {
            try {
              const dates = index[hub] || [];
              if (!dates.length) return [];
              const latestDate = dates.slice().sort().slice(-1)[0];
              const snapResult = await window.cloudflareAPI.get(`snapshot:${hub}:${latestDate}`);
              if (!snapResult || !snapResult.value) return [];
              const snap = JSON.parse(snapResult.value);
              if (snap && snap.rows) return snap.rows.map(r => Object.assign({}, r, { hub }));
              return [];
            } catch (e) {
              console.warn('Failed to load data for hub:', hub, e);
              return [];
            }
          }));
          perHub.forEach(rows => { rows.forEach(r => allData.push(r)); });
        } else {
          // No hub index means no snapshots can be located — say that instead
          // of reporting a successful load of zero records.
          statusEl.innerHTML = '<span class="error">Could not read the manifest hub index, so no rider snapshots could be located. Reload once the dashboard has been used once.</span>';
          rowsEl.innerHTML = '<tr><td colspan="10" class="error">No data available.</td></tr>';
          statsRowEl.innerHTML = '';
          return;
        }

        console.log('All data collected:', allData);
        allRows = allData.filter(r => r.daysWorking > 0 && r.deliverySuccessRate > 0);
        console.log('Filtered rows:', allRows);
        debugLogSample();
        renderVehicleSeg();
        renderFilterChips();
        renderTop10();
        renderStats();
        renderRows();
        statusEl.textContent = `Loaded ${allRows.length} active rider records from ${hubs.length} hubs`;
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = '<span class="error">Could not load ranking data: ' + (err.message || 'unknown error') + '</span>';
        rowsEl.innerHTML = '<tr><td colspan="10" class="error">No data available.</td></tr>';
        statsRowEl.innerHTML = '';
      }
    }

    function getFilteredRows() {
      let rows = allRows;
      if (!(currentHubs.has('All') || currentHubs.size === 0)) {
        const targets = new Set([...currentHubs].map(normalizeHubName));
        rows = rows.filter(r => targets.has(normalizeHubName(r.hub)));
      }
      if (!(currentVehicleGroups.has('all') || currentVehicleGroups.size === 0)) {
        rows = rows.filter(r => currentVehicleGroups.has(vehicleGroupKey(r.vehicleType)));
      }
      if (search) {
        const q = search.toLowerCase();
        rows = rows.filter(r => 
          String(r.name || '').toLowerCase().includes(q) || 
          String(r.id || '').toLowerCase().includes(q)
        );
      }
      return rows;
    }

    // Debug: log sample row structure
    function debugLogSample() {
      if (allRows.length > 0) {
        console.log('Sample row keys:', Object.keys(allRows[0]));
        console.log('Sample row:', allRows[0]);
      }
    }

    function applySorting(rows) {
      const dir = sortDir === 'asc' ? 1 : -1;
      return rows.slice().sort((a, b) => {
        let av = a[sortKey], bv = b[sortKey];
        if (typeof av === 'string') { av = av.toLowerCase(); bv = (bv || '').toLowerCase(); }
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return 0;
      });
    }

    function fmtPct(n) { return (n||0).toFixed(1)+'%'; }
    function fmtNum(n) { return Math.round(n||0).toLocaleString(); }

    function renderStats() {
      const rows = getFilteredRows();
      const topCount = Math.min(5, rows.length);
      const bottomCount = Math.min(5, rows.length);
      const avgSuccess = rows.length ? rows.reduce((a,r)=>a+(r.deliverySuccessRate||0),0)/rows.length : 0;
      const avgAttendance = rows.length ? rows.reduce((a,r)=>a+(r.attendanceRate||0),0)/rows.length : 0;
      const totalDelivered = rows.reduce((a,r)=>a+(r.parcelsDelivered||0),0);
      
      const stats = [
        { label: 'Active Riders', value: rows.length, cls: '' },
        { label: 'Avg Delivery Success', value: fmtPct(avgSuccess), cls: avgSuccess >= 90 ? 'teal' : (avgSuccess < 75 ? 'brick' : '') },
        { label: 'Avg Attendance', value: fmtPct(avgAttendance), cls: '' },
        { label: 'Total Delivered', value: fmtNum(totalDelivered), cls: 'amber' },
      ];
      statsRowEl.innerHTML = stats.map((s, idx) => `
        <div class="stat-card">
          <div class="stat-label">${s.label}</div>
          <div class="stat-value ${s.cls}">${s.value}</div>
        </div>
      `).join('');
    }

    function rankColor(rank){
      const n = Math.max(1, Number(rank||1));
      const t = Math.min(1, (n - 1) / 19);
      const h = Math.round(140 * (1 - t));
      return `hsl(${h}, 85%, 42%)`;
    }

    function renderRows() {
      let rows = getFilteredRows();
      rows = applySorting(rows);
      
      if (!rows.length) {
        rowsEl.innerHTML = '<tr><td colspan="10" class="muted">No rider records found for this hub.</td></tr>';
        return;
      }

      // Add rank and performance indicator
      const rowsWithRank = rows.map((r, idx) => ({
        ...r,
        _rank: idx + 1,
        _isTop: idx < 5,
        _isBottom: idx >= rows.length - 5
      }));

      const scrollPos = tableCardEl ? tableCardEl.scrollTop : 0;

      const html = rowsWithRank.map(r => {
        const rankStyle = `background:${rankColor(r._rank)};color:#fff;box-shadow:0 0 12px ${rankColor(r._rank)}`;
        const perfClass = r._isTop ? 'perf-top' : (r._isBottom ? 'perf-bottom' : '');
        const perfLabel = r._isTop ? 'Top' : (r._isBottom ? 'Bottom' : '');
        return `
          <tr>
            <td><span class="rank-badge" style="${rankStyle}">${r._rank}</span></td>
            <td style="font-weight:600;">${escapeHtml(r.name)}</td>
            <td><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;background:var(--hover);padding:1px 6px;border-radius:4px;">${escapeHtml(r.id)}</span></td>
            <td><span style="background:rgba(238,77,45,.12);color:var(--amber-deep);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;">${escapeHtml(r.hub || 'N/A')}</span></td>
            <td>${escapeHtml(r.vehicleType || 'N/A')}</td>
            <td class="num">${fmtNum(r.daysWorking)}</td>
            <td class="num">${(r.avgParcelsPerDay||0).toFixed(1)}</td>
            <td class="num rate-num" style="color:${successColor(r.deliverySuccessRate)}">${fmtPct(r.deliverySuccessRate)}</td>
            <td class="num">${fmtPct(r.attendanceRate)}</td>
            <td class="num">${fmtNum(r.parcelsDelivered)}</td>
          </tr>
        `;
      }).join('');
      rowsEl.innerHTML = html;
      if (tableCardEl) {
        tableCardEl.scrollTop = scrollPos;
        requestAnimationFrame(() => { tableCardEl.scrollTop = scrollPos; });
      }
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&','<':'<','>':'>','"':'"',"'":"'"}[c])); }

    function successColor(rate){
      const r = Math.max(0, Math.min(100, Number(rate||0)))/100;
      const a = Math.round(255*(1-r) + 0*r);
      const b = Math.round(107*(1-r) + 200*r);
      const c = Math.round(107*(1-r) + 120*r);
      return `rgb(${a},${b},${c})`;
    }

    // Table header sorting
    const sortableHeaders = document.querySelectorAll('th');
    sortableHeaders.forEach(th => {
      th.addEventListener('click', () => {
        const key = th.getAttribute('data-sort') || th.textContent.trim().toLowerCase().replace(/\s+/g, '');
        const keyMap = {
          'rank': '_rank',
          'rider name': 'name',
          'driver id': 'id',
          'hub': 'hub',
          'vehicle': 'vehicleType',
          'days working': 'daysWorking',
          'parcels/day': 'avgParcelsPerDay',
          'delivery success': 'deliverySuccessRate',
          'attendance': 'attendanceRate',
          'parcels delivered': 'parcelsDelivered'
        };
        const sortKeyMapped = keyMap[key] || key;
        if (sortKey === sortKeyMapped) { sortDir = sortDir === 'asc' ? 'desc' : 'asc'; }
        else { sortKey = sortKeyMapped; sortDir = 'desc'; }
        renderRows();
      });
    });

    function wireRankingHubDropdown(){
      const trigger=document.getElementById('rankingHubTrigger');
      const menu=document.getElementById('rankingHubMenu');
      if(!trigger||!menu) return;
      trigger.addEventListener('click', e=>{
        e.stopPropagation();
        if(menu.classList.contains('open')) closeRankingHubDropdown();
        else openRankingHubDropdown();
      });
      document.addEventListener('click', e=>{
        if(menu.contains(e.target)) return;
        closeRankingHubDropdown();
      });
    }

    if (typeof window.applySavedTheme === 'function') window.applySavedTheme();

    searchEl.addEventListener('input', e => { search = e.target.value; renderRows(); renderTop10(); });

    (async function start(){
      try {
        const hubs = await window.Auth.getHubs();
        applyHubFilter(hubs);
        await loadData();
      } catch (err) {
        console.error('Ranking page failed to start:', err);
        statusEl.innerHTML = '<span class="error">Could not load rider ranking: ' +
          (err && err.message ? err.message : 'unknown error') + '</span>';
        return;
      }

      wireRankingHubDropdown();

      if (window.Auth && typeof window.Auth.onHubsChange === 'function') {
        try {
          window.Auth.onHubsChange(newHubs => {
            applyHubFilter(newHubs);
            loadData().catch(() => {});
          });
        } catch (e) { /* ignore */ }
      }
    })();

    setInterval(async function(){
      if(document.hidden) return;
      await loadData().catch(() => {});
    }, 30000);
  </script>

  <!-- Shared Option Button / Options drawer (appears on all pages) -->
  <script src="options-drawer.js" defer></script>
</body>
