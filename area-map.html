<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area Map — Rider Hubs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    body{padding:0;margin:0;}
    .page-shell{max-width:1440px;margin:0 auto;padding:28px;}
    .page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
    .page-head h1{font-family:'Space Grotesk',sans-serif;font-size:24px;margin:0;}
    .page-head p{margin:4px 0 0;color:var(--text-dim);font-size:13px;max-width:640px;}
    .status-box{background:var(--card);border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--text-dim);}
    .page-actions{display:flex;align-items:center;gap:10px;}
    .back-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;text-decoration:none;transition:background .15s ease,border-color .15s ease;}
    .back-link:hover{background:var(--hover);}
    .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .tab-btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px;transition:transform .2s ease,background .15s ease,border-color .15s ease,color .15s ease;}
    .tab-btn:hover{transform:translateY(-2px);}
    .tab-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}

    .map-toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
    .layer-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
    .layer-toggle button{border:none;background:var(--card);color:var(--text);padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit;}
    .layer-toggle button.active{background:var(--ink);color:#fff;}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-dim);align-items:center;}
    .legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle;}
    .legend .note{font-size:11px;}

    #map{height:72vh;min-height:460px;width:100%;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;box-shadow:0 10px 30px var(--shadow);}
    .leaflet-popup-content{font-family:'IBM Plex Sans',sans-serif;font-size:13px;}
    .leaflet-popup-content h4{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;}
    .area-rider{display:flex;justify-content:space-between;gap:10px;padding:2px 0;}
    .area-rider .agency{color:var(--text-dim);font-size:11px;}
    .area-count{font-family:'IBM Plex Mono',monospace;font-weight:700;}
    .muted{color:var(--text-dim);}
    .error{color:var(--brick);}
    .animate-in{animation:fadeUp .5s cubic-bezier(.22,.61,.36,1) both;}
  </style>
</head>
<body>
  <div class="page-shell">
    <div class="page-head">
      <div>
        <h1>Area Map</h1>
        <p>Topographic (geological) map of every rider <b>Area</b>, plotted from the shared Riders &amp; Agency sheet. Marker size reflects the number of riders; color shows the hub.</p>
      </div>
      <div class="page-actions">
        <a class="back-link" href="index.html">← Back to Dispatch Board</a>
        <div class="status-box" id="sheetStatus">Loading sheet…</div>
      </div>
    </div>

    <div class="tabs" id="hubTabs">
      <button class="tab-btn active" data-hub="All" type="button">All Hubs</button>
      <button class="tab-btn" data-hub="Buguias" type="button">Buguias</button>
      <button class="tab-btn" data-hub="MB Atok" type="button">MB Atok</button>
      <button class="tab-btn" data-hub="Bauko" type="button">Bauko</button>
    </div>

    <div class="map-toolbar">
      <div class="layer-toggle" id="layerToggle">
        <button type="button" data-layer="simple" class="active">Simple</button>
        <button type="button" data-layer="street">Street</button>
      </div>
      <div class="legend">
        <span><span class="dot" style="background:var(--teal)"></span>Buguias</span>
        <span><span class="dot" style="background:var(--amber-deep)"></span>MB Atok</span>
        <span><span class="dot" style="background:var(--brick)"></span>Bauko</span>
        <span class="note">Markers are placed at the Area / municipality center.</span>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script type="module">
    const __perms = await window.Auth.guard();
    if (!__perms) throw new Error('redirect');
    const SHEET_ID = '1aGJXuO3tz5oLJyL6piEljz4A6cg6l0cnKvmtIpLkqMI';
    const HUB_SHEET_NAME = { Buguias: 'Buguias', Bauko: 'Bauko', 'MB Atok': 'MB Atok' };
    const HUBS = ['Buguias', 'MB Atok', 'Bauko'];
    const HUB_COLOR = {
      'Buguias': '#3F8F6D',
      'MB Atok': '#C97F1E',
      'Bauko': '#C1503F',
      'MB Mankayan': '#8FAE4E'
    };
    const HUB_CENTER = {
      'Buguias': [16.6833, 120.8333],
      'MB Atok': [16.5833, 120.7500],
      'Bauko': [16.9833, 120.8667],
      'MB Mankayan': [16.8670, 120.7833]
    };

    // Known centers for municipalities / barangays referenced in the Area field.
    const MUNICIPALITY_COORDS = {
      'mankayan': [16.8670, 120.7833],
      'bauko': [16.9833, 120.8667],
      'buguias': [16.6833, 120.8333],
      'bakun': [16.7833, 120.6667],
      'kibungan': [16.5333, 120.6667],
      'tinoc': [16.4667, 120.8833],
      'atok': [16.5833, 120.7500],
      'la trinidad': [16.4667, 120.5833],
      'baguio': [16.4023, 120.5960],
      'bokod': [16.3333, 120.7333],
      'kabayan': [16.6333, 120.8000],
      'kapangan': [16.5667, 120.6667],
      'sablan': [16.5167, 120.5333],
      'natubleng': [16.9500, 120.7800]
    };
    // A few explicit barangay overrides for tighter accuracy.
    const AREA_COORDS = {
      'Poblacion Mankayan': [16.8670, 120.7833],
      'Loo Buguias': [16.7000, 120.8200],
      'Abatan Buguias': [16.6200, 120.8300],
      'Sebang Buguias': [16.6900, 120.8000],
      'Paco Mankayan': [16.8600, 120.7800],
      'Sapid Mankayan': [16.8550, 120.7900],
      'Taneg Mankayan': [16.8750, 120.7700],
      'Tabio Mankayan': [16.8500, 120.7600],
      'Guinaoang Mankayan': [16.8900, 120.8000],
      'FarFlang-Amlimay': [16.6780, 120.8240],
      'Baculongan Norte Buguias': [16.7000, 120.8600],
      'Baculongan Sur Buguias': [16.7050, 120.8650]
    };

    const statusEl = document.getElementById('sheetStatus');
    const tabButtons = Array.from(document.querySelectorAll('.tab-btn'));
    const layerToggle = document.getElementById('layerToggle');

    function applyHubFilter(){
      const allowed = (__perms && __perms.hubs && __perms.hubs.length) ? __perms.hubs : ['Buguias','MB Atok','Bauko'];
      tabButtons.forEach(btn=>{
        const hub = btn.dataset.hub;
        const ok = allowed.includes(hub) || (hub==='All' && allowed.length>1);
        btn.style.display = ok ? '' : 'none';
      });
      if(!allowed.includes(currentHub)){
        currentHub = allowed[0] || currentHub;
        tabButtons.forEach(b=>b.classList.toggle('active', b.dataset.hub===currentHub));
      }
    }

    let allRows = [];
    let currentHub = 'All';
    let map = null;
    let simpleLayer = null;
    let streetLayer = null;
    let markerLayer = null;

    function parseCsvLine(line) {
      const values = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (ch === ',' && !inQuotes) { values.push(current); current = ''; }
        else { current += ch; }
      }
      values.push(current);
      return values;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function findHeaderIndex(headers, candidates) {
      for (const candidate of candidates) {
        const index = headers.findIndex(h => h === candidate || h.includes(candidate));
        if (index >= 0) return index;
      }
      return -1;
    }

    function getCell(values, index) {
      return index >= 0 && values[index] !== undefined ? values[index].trim() : '';
    }

    async function loadHubSheet(hub) {
      const sheetName = HUB_SHEET_NAME[hub] || HUB_SHEET_NAME.Buguias;
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('Unable to fetch sheet for ' + hub);
      const text = await response.text();
      const rawLines = text.split(/\r\n|\n|\r/);
      if (rawLines.length < 2) return [];

      const parsedLines = rawLines.map(line => parseCsvLine(line));
      const headerRowIndex = parsedLines.findIndex(values => {
        const normalized = values.map(v => String(v || '').trim().toLowerCase());
        return normalized.some(h => ['rider name','rider','driver name','driver','name'].includes(h))
            && normalized.some(h => ['area','location'].includes(h));
      });
      if (headerRowIndex < 0) return [];

      const headers = parsedLines[headerRowIndex];
      const expectedColumns = headers.length;
      const normalizedHeaders = headers.map(h => String(h || '').trim().toLowerCase());

      function isHeaderRow(values) {
        const normalized = values.map(v => String(v || '').trim().toLowerCase());
        return normalizedHeaders.every((header, idx) => normalized[idx] === header || normalized[idx] === '');
      }

      const dataRows = parsedLines.slice(headerRowIndex + 1)
        .filter(row => row.some(cell => String(cell || '').trim() !== ''))
        .filter(row => !isHeaderRow(row))
        .map(row => row.concat(Array(Math.max(0, expectedColumns - row.length)).fill('')));

      const index = {
        riderName: findHeaderIndex(normalizedHeaders, ['rider name','rider','driver name','driver','name']),
        area: findHeaderIndex(normalizedHeaders, ['area','location']),
        agency: findHeaderIndex(normalizedHeaders, ['agency','agencies']),
        status: findHeaderIndex(normalizedHeaders, ['status','state']),
        hub: findHeaderIndex(normalizedHeaders, ['hub','hubs','branch','branch name'])
      };

      return dataRows.map(values => ({
        riderName: getCell(values, index.riderName),
        area: getCell(values, index.area),
        agency: getCell(values, index.agency),
        status: getCell(values, index.status),
        hub: index.hub >= 0 && getCell(values, index.hub) ? getCell(values, index.hub) : hub
      })).filter(row => row.riderName || row.area);
    }

    async function loadAllSheets() {
      allRows = [];
      let loaded = 0;
      for (const hub of HUBS) {
        try {
          const rows = await loadHubSheet(hub);
          allRows = allRows.concat(rows);
          loaded += rows.length;
        } catch (err) {
          console.error(err);
        }
      }
      return loaded;
    }

    function resolveCoords(area, hub) {
      const a = (area || '').trim();
      if (AREA_COORDS[a]) return AREA_COORDS[a];
      const lower = a.toLowerCase();
      for (const key in MUNICIPALITY_COORDS) {
        if (lower.includes(key)) return MUNICIPALITY_COORDS[key];
      }
      return null; // caller will geocode / fall back to hub center
    }

    async function geocodeNominatim(area) {
      try {
        const q = `${area}, Benguet, Philippines`;
        const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
        const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!r.ok) return null;
        const j = await r.json();
        if (j && j.length) return [parseFloat(j[0].lat), parseFloat(j[0].lon)];
      } catch (e) { /* offline / blocked */ }
      return null;
    }

    function getFilteredRows() {
      if (currentHub === 'All') return allRows;
      const target = currentHub.toLowerCase();
      return allRows.filter(r => String(r.hub || '').toLowerCase().includes(target));
    }

    function groupByArea(rows) {
      const map = new Map();
      rows.forEach(r => {
        const key = (r.area || '').trim();
        if (!key) return;
        if (!map.has(key)) map.set(key, { area: key, riders: [], hub: r.hub });
        map.get(key).riders.push(r);
      });
      return Array.from(map.values());
    }

    function initMap() {
      if (map) return;
      map = L.map('map', { zoomControl: true }).setView([16.78, 120.80], 10);
      // Simple, clean Google-Maps-like basemap (CARTO Positron, no API key).
      simpleLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        subdomains: 'abcd',
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
      });
      streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      });
      simpleLayer.addTo(map);
      markerLayer = L.layerGroup().addTo(map);
    }

    async function renderMap() {
      if (!map) initMap();
      markerLayer.clearLayers();
      const rows = getFilteredRows();
      const areas = groupByArea(rows);

      const bounds = [];
      for (const a of areas) {
        let coords = resolveCoords(a.area, a.hub);
        if (!coords) {
          coords = await geocodeNominatim(a.area);
          if (coords) await new Promise(res => setTimeout(res, 1100)); // respect Nominatim usage policy
        }
        if (!coords) coords = HUB_CENTER[a.hub] || [16.78, 120.80];

        const count = a.riders.length;
        const radius = Math.max(7, Math.min(26, 6 + count * 1.4));
        const color = HUB_COLOR[a.hub] || '#5B6472';

        const popupHtml = `<h4>${escapeHtml(a.area)}</h4>`
          + `<div class="muted" style="margin-bottom:6px;">${count} rider${count === 1 ? '' : 's'} · ${escapeHtml(a.hub)}</div>`
          + a.riders.map(r => `
              <div class="area-rider">
                <span><b>${escapeHtml(r.riderName)}</b> <span class="agency">${escapeHtml(r.agency || '')}</span></span>
                <span class="area-count">${escapeHtml(r.status || '')}</span>
              </div>`).join('');

        L.circleMarker(coords, {
          radius,
          color: color,
          weight: 2,
          fillColor: color,
          fillOpacity: 0.55
        }).bindPopup(popupHtml).addTo(markerLayer);

        bounds.push(coords);
      }

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: 13 });
      }
      statusEl.textContent = `Plotted ${areas.length} area${areas.length === 1 ? '' : 's'} · ${rows.length} riders`;
    }

    layerToggle.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn || !map) return;
      const layer = btn.dataset.layer;
      layerToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
      if (layer === 'simple') { map.removeLayer(streetLayer); simpleLayer.addTo(map); }
      else { map.removeLayer(simpleLayer); streetLayer.addTo(map); }
    });

    tabButtons.forEach(btn => {
      btn.addEventListener('click', async () => {
        if (btn.dataset.hub === currentHub) return;
        currentHub = btn.dataset.hub;
        tabButtons.forEach(b => b.classList.toggle('active', b === btn));
        statusEl.textContent = 'Updating map…';
        await renderMap();
      });
    });

    if (typeof window.applySavedTheme === 'function') window.applySavedTheme();

    (async function start() {
      try {
        const n = await loadAllSheets();
        if (!n) throw new Error('No rows');
        applyHubFilter();
        initMap();
        await renderMap();
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = '<span class="error">Could not load the Riders sheet. Check the link and try again.</span>';
      }
    })();
  </script>

  <!-- Shared Option Button / Options drawer (appears on all pages) -->
  <script src="options-drawer.js" defer></script>
</body>
</html>
